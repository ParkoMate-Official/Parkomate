[project]
name = "parkomate-station"
version = "0.1.0"
description = "Parkomate production-line station: programming, testing, labeling and packaging of controller PCBs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Parkomate station team" }]
dependencies = [
    "PySide6>=6.7,<6.11",
    "pydantic>=2.7,<3",
    "tomli-w>=1.0",
    "argon2-cffi>=23.1",
    "keyring>=25.0",
    "openpyxl>=3.1",
    # hardware + server (full build)
    "pyserial>=3.5",
    "esptool>=4.8",
    "httpx>=0.27",
    "opencv-python-headless>=4.9",   # headless: no Qt of its own (would clash with PySide6)
    "pyzbar>=0.1.9",
]

[project.scripts]
parkomate = "parkomate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1",
]
build = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkomate"]

[tool.uv]
python-preference = "managed"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that deliberately wait (worker / timing tests)",
]
qt_api = "pyside6"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["parkomate"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "N",        # naming
    "T20",      # no print()
    "S",        # bandit (security)
    "PTH",      # use pathlib
    "C4",       # comprehensions
    "RET",      # return hygiene
]
ignore = [
    "S101",    # assert is fine in tests and for type narrowing
    "S311",    # random is only used by the hardware mock, never for security
    "S105",    # flags enum names like ALL_PASS / AUTH_WEAK_PASSWORD; secrets live in the keyring
    "RUF001",  # ambiguous unicode chars: we deliberately use ✓ ✕ – °
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "PTH", "N802"]
"src/parkomate/cli.py" = ["T201"]
# SQL is assembled only from module-constant column lists / assignments; values are always
# bound parameters.
"src/parkomate/data/repositories/**" = ["S608"]
"src/parkomate/ui/**" = ["N802", "N815"]  # Qt overrides use camelCase (paintEvent, keyPressEvent)
"src/parkomate/ui/theme/qss.py" = ["E501"]  # one stylesheet rule per line reads best

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["parkomate"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# hardware libraries without type information (esptool, ZBar, pyserial)
module = ["esptool", "esptool.*", "pyzbar", "pyzbar.*", "serial", "serial.*"]
ignore_missing_imports = true
